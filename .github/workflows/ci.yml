# Integración continua de MiBici: estilo, pruebas y seguridad en cada cambio hacia main.
# No necesita datos de data/, secretos ni un servidor de MLflow: las pruebas usan datos
# sintéticos y una base SQLite temporal, y bloquean cualquier conexión de red. Sólo la
# instalación de dependencias y pip-audit (dentro de make security) usan la red.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Estilo, pruebas y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "true"
      LOGURU_COLORIZE: "false"
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.10.20
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        # requirements.txt fija cada versión con == e incluye "-e ." para el paquete mibici
        run: python -m pip install -r requirements.txt

      - name: Revisar estilo con ruff
        run: ruff check

      - name: Revisar formato con ruff
        run: ruff format --check

      - name: Ejecutar las pruebas
        run: python -m pytest -q tests

      - name: Analizar seguridad con Bandit y pip-audit
        run: make security
